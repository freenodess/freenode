module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod
baseURL: "https://freenodess.github.io/freenode/"
title: freenode
copyright: "© [免费VPN节点分享](https://github.com/freenodess/freenode)"
theme: hugo-PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts", "papermod"]

minify:
  disableXML: true
  # minifyOutput: true

pagination:
  disableAliases: false
  pagerSize: 3

languages:
  en:
    languageName: "chainese"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: 科学上网机场
          url: about
          weight: 1
        - name: 归档
          url: archives
          weight: 2
        - name: 搜索
          url: search/
          weight: 2
        - name: 标签
          url: tags/
          weight: 4
        - name: "88云加速"
          url: https://qq.88cloud.dpdns.org/#/register?code=n4KLfZJb
  en:
    languageName: "English"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: 科学上网机场
          url: about
          weight: 1
        - name: Archives
          url: archives
          weight: 2
        - name: Search
          url: search/
          weight: 2
        - name: Tags
          url: tags/
          weight: 4
        - name: "88云加速"
          url: https://qq.88cloud.dpdns.org/#/register?code=n4KLfZJb
  fr:
    languageName: "科学上网"
    weight: 2
    title: 科学上网机场
    taxonomies:
      category: FRcategories
      tag: FRtags
      series: FRseries
    menu:
      main:
        - name: Archive
          url: archives/
          weight: 5
        - name: FRTags
          url: frtags
          weight: 10
        - name: FRCategories
          url: frcategories
          weight: 10
        - name: FRSeries
          url: frseries
          weight: 10
        - name: External
          url: "https://qq.88cloud.dpdns.org/#/register?code=n4KLfZJb"

    # custom params for each language should be under [langcode].parms - hugo v0.120.0
    params:
      languageAltTitle:  科学上网88云加速
      profileMode:
        enabled: true
        title:  88云加速
        imageUrl: "https://images.unsplash.com/-d1d0cf377fde?w=200&h=200"
        imageTitle: ProfileMode image
        # imageWidth: 120
        # imageHeight: 120
        subtitle: "☄️ Fast | ☁️ Fluent | 🌙 Smooth | 📱 Responsive"
        buttons:
          - name: 88云加速
            url: posts
          - name: 科学上网首选
            url: https://qq.88cloud.dpdns.org/#/register?code=n4KLfZJb

 

outputFormats:
  llms:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - llms

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "免费节点每日更新 - https://github.com/freenodess/freenode"
  author: 公益免费节点
  # author: ["Me", "You"] # multiple authors

  defaultTheme: auto
  # disableThemeToggle: true
  ShowShareButtons: true
  ShowReadingTime: true
  # disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  # comments: false
  images: ["images/papermod-cover.png"]

  profileMode:
    enabled: false
    title: 免费节点分享
    imageUrl: "#"
    imageTitle: my image
    # imageWidth: 120
    # imageHeight: 120
    buttons:
      - name: Archives
        url: archives
      - name: Tags
        url: tags

  homeInfoParams:
    Title: "免费节点"
    Content: |
      每天分享公益免费节点

  socialIcons:
    - name: telegram
      title: 免费节点每日分享机场VPN推荐
      url: "https://t.me/clashjd"
    - name: github
      title: View Source on Github
      url: "https://github.com/freenodess/freenode"
    - name: Discord
      title: Join discord community
      url: "https://discord.gg/"
    - name: X
      title: Share PaperMod on X/Twitter
      url: "https://x.com/"
  editPost:
    URL: "https://github.com/freenodess/freenode/tree/main/content"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

