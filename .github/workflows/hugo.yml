name: Deploy Hugo Site with PaperMod

on:
  push:
    branches:
      - main # 如果你的默认分支是 master，请改成 master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # 💡 核心保险：云端自动检测并下载 PaperMod 主题，防止主题没用上
      - name: Ensure PaperMod Theme Exists
        run: |
          if [ ! -d "themes/hugo-PaperMod" ]; then
            mkdir -p themes
            git clone https://github.com/adityatelange/hugo-PaperMod.git themes/hugo-PaperMod
          fi

      - name: Build Website
        run: hugo --minify

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          commit_message: "Auto-deploy PaperMod theme via GitHub Actions"
