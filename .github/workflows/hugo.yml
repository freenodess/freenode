name: Deploy Hugo Site with PaperMod

on:
  push:
    branches:
      - main # 如果你的默认分支是 master，请改成 master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Force Download PaperMod Theme
        run: |
          rm -rf themes/hugo-PaperMod
          mkdir -p themes
          git clone --depth=1 https://github.com/adityatelange/hugo-PaperMod.git themes/hugo-PaperMod
          # 打印目录确认主题是否正确就位
          ls -la themes/
          ls -la themes/hugo-PaperMod/

      - name: Build Website
        run: hugo --minify

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          commit_message: "Auto-deploy PaperMod theme via GitHub Actions"
