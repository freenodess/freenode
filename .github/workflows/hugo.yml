name: Deploy Hugo Site with PaperMod

on:
  push:
    branches:
      - main # 如果你的默认分支是 master，请改成 master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PaperMod 作为 Hugo 模块需要 Go 环境支持
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # 兜底：手动创建目录并克隆到正确位置，同时初始化 Hugo 模块
      - name: Force Prepare Theme
        run: |
          mkdir -p themes
          if [ ! -d "themes/hugo-PaperMod" ]; then
            git clone --depth=1 https://github.com/adityatelange/hugo-PaperMod.git themes/hugo-PaperMod
          fi
          # 确保 Hugo 能识别到模块
          hugo mod get github.com/adityatelange/hugo-PaperMod || true

      - name: Build Website
        run: hugo --minify

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          commit_message: "Auto-deploy PaperMod theme via GitHub Actions"
